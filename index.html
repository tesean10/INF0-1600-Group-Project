<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlixHunt</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="navbar">
        <h2>FlixHunt</h2>

        <div class="nav-right">
            <div class="nav-links">
                <a href="login.html">Login</a>
                <a href="signup.html">Sign Up</a>
            </div>

            <div class="hamburger" onclick="toggleMenu()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-list" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
                </svg>
            </div> 
        </div>

        <div id="menu" class="menu"> 
            <p><strong>Browse by Genre</strong></p>
            <div id="genre-list"></div>

            <p><strong>Sort By</strong></p>
            <a href="#" onclick="sortMovies('date')">Date</a>
            <a href="#" onclick="sortMovies('alpha')">Alphabetical</a>
        </div>
    </div>

    <div class="hero">
        <h1>Welcome to FlixHunt</h1>
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Search for movies...">
            <button class="search-btn" onclick="searchMovies()">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                    <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                </svg>
             </button>
        </div>

        <button class="watch-btn">Search Now</button>
    </div>
    <div id="featured-movie" class="featured"></div> //for big movie container before gallery with other movies
    <div id="movie-container" class="container"></div> //container for js to fill the movies

    <script src="script.js"></script>
</body>
</html>
